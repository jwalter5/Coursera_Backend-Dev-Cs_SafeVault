<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Management | SafeVault</title>
    <link rel="stylesheet" href="/styles.css?v=4">
</head>
<body>
    <main id="admin-page" class="card card-wide" hidden>
        <h1>User Management</h1>
        <p>Administrators can manage user roles or delete users here.</p>

        <p id="status-message" class="status" role="status" aria-live="polite"></p>
        <div class="table-wrapper">
            <table class="users-table">
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Username</th>
                        <th scope="col">Email Address</th>
                        <th scope="col">Role</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody id="users"></tbody>
            </table>
        </div>

        <a class="back-link" href="/">Back to Home</a>
    </main>

    <dialog id="confirm-password-dialog" aria-labelledby="confirm-password-title">
        <form id="confirm-password-form">
            <h2 id="confirm-password-title">Confirm Action</h2>
            <p id="confirm-password-prompt"></p>

            <label for="admin-current-password">Current Password</label>
            <input type="password" id="admin-current-password" name="currentPassword" autocomplete="current-password" maxlength="128" required>

            <div class="dialog-actions">
                <button id="cancel-password-confirmation" class="button-secondary" type="button">Cancel</button>
                <button type="submit">Confirm</button>
            </div>
        </form>
    </dialog>
    <script src="/auth.js"></script>
    <script src="/admin.js"></script>
</body>
</html>
