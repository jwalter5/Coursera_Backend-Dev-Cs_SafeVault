<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Benutzerverwaltung | SafeVault</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main id="admin-page" class="card card-wide" hidden>
        <h1>Benutzerverwaltung</h1>
        <p>Hier können Administratoren die Rollen aller Benutzer verwalten oder Benutzer löschen.</p>

        <p id="status-message" class="status" role="status" aria-live="polite"></p>
        <div class="table-wrapper">
            <table class="users-table">
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Benutzername</th>
                        <th scope="col">E-Mail-Adresse</th>
                        <th scope="col">Rolle</th>
                        <th scope="col">Aktionen</th>
                    </tr>
                </thead>
                <tbody id="users"></tbody>
            </table>
        </div>

        <a class="back-link" href="/">Zurück zur Homepage</a>
    </main>
    <script src="/auth.js"></script>
    <script src="/admin.js"></script>
</body>
</html>
