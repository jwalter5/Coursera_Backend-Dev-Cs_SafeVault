<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | SafeVault</title>
    <link rel="stylesheet" href="/styles.css?v=4">
</head>
<body>
    <main class="card">
        <h1>Login</h1>

        <form id="login-form">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" maxlength="50" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" maxlength="128" required>

            <button type="submit">Log In</button>
            <p id="error-message" class="error" role="alert" hidden></p>
        </form>

        <a class="back-link" href="/">Back to Home</a>
    </main>
    <script src="/auth.js"></script>
    <script src="/login.js"></script>
</body>
</html>
