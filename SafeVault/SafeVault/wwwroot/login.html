<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | SafeVault</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main class="card">
        <h1>Login</h1>

        <form id="login-form">
            <label for="username">Benutzername</label>
            <input type="text" id="username" name="username" autocomplete="username" required>

            <label for="password">Passwort</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <button type="submit">Anmelden</button>
            <p id="error-message" class="error" role="alert" hidden></p>
        </form>

        <a class="back-link" href="/">Zurück zur Homepage</a>
    </main>
    <script src="/auth.js"></script>
    <script>
        SafeVaultAuth.redirectAuthenticatedUser();
        SafeVaultAuth.bindForm("login-form", "/api/auth/login", ["username", "password"]);
    </script>
</body>
</html>
